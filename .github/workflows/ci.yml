name: CI

on:
  push:
  pull_request:

jobs:
  release-candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90
      - name: Verify version, clean source and immutable tag target
        run: python3 script/check-release-candidate.py --version "${GITHUB_REF_NAME#v}" --require-tag

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Install PostgreSQL 16 server tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
      - name: Test database migration behavior
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: ./script/test_decision_run_partition_migrations.sh
      - name: Run offline golden DSL evaluation
        run: ./script/eval-agents.sh
      - name: Upload golden evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-golden-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/eval-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Test retrieval and drift evaluators
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run Rust test suite
        run: cargo test --lib --bin fuxi-dmn
      - name: Upload isolated database and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/test-results/database-regression.log
          if-no-files-found: warn
          retention-days: 14

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js and Playwright Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/fuxi-browser" playwright-core@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - name: Build the complete production image from this revision
        run: |
          docker build --progress=plain \
            --build-arg FUXI_BUILD_COMMIT="$GITHUB_SHA" \
            --build-arg FUXI_SOURCE_CLEAN=1 \
            --tag fuxi-dmn:ci .
      - name: Exercise an isolated deployment without external model calls
        run: |
          docker pull pgvector/pgvector:pg18
          python3 script/smoke-production-image.py --image fuxi-dmn:ci --require-production-source --workflow --browser --output target/production-smoke.json
        env:
          PLAYWRIGHT_CORE_PATH: ${{ runner.temp }}/fuxi-browser/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
      - name: Upload production image smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/production-smoke.json
            target/test-results/production-browser-projects.png
            target/test-results/production-image-browser.log
          if-no-files-found: warn
          retention-days: 14
