# Fresh PostgreSQL 16 deployment using a separate, project-scoped data volume.
# Existing postgres_data volumes are retained; use this file for subsequent commands.
# Supply credentials via --env-file; never commit real secrets.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fuxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuxi_dmn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD must be set}
      APP_DB_USER: ${APP_DB_USER:-fuxi}
      APP_DB_OWNER: ${APP_DB_OWNER:-fuxi_owner}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      FUXI_DB_SCRIPT_DIR: /opt/fuxi-db-scripts
    volumes:
      # Fresh PG16 data goes into a new volume, leaving legacy data untouched.
      - postgres_fresh_pg16_20261118:/var/lib/postgresql/data
      - type: bind
        source: ./script
        target: /opt/fuxi-db-scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./script/bootstrap-production-db.sh
        target: /docker-entrypoint-initdb.d/001-bootstrap.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fuxi_dmn"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${FUXI_IMAGE:-fuxi-dmn:local}
    container_name: fuxi-dmn
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:-fuxi}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/fuxi_dmn
      APP_ENV: ${APP_ENV:-production}
      BIND_ADDR: 0.0.0.0:3000
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CAPTCHA_POW_DIFFICULTY: ${CAPTCHA_POW_DIFFICULTY:-14}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
      SHUTDOWN_DRAIN_SECONDS: ${SHUTDOWN_DRAIN_SECONDS:-2}
      DECISION_COPILOT_ENABLED: ${DECISION_COPILOT_ENABLED:-true}
      REQUIRE_HISTORICAL_REGRESSION_BEFORE_PUBLISH: ${REQUIRE_HISTORICAL_REGRESSION_BEFORE_PUBLISH:-true}
      OPTIMIZATION_AUTODRAFT_MODE: ${OPTIMIZATION_AUTODRAFT_MODE:-off}
      OPTIMIZATION_AUTODRAFT_PROJECT_IDS:
      AGENT_ORCHESTRATION_STALE_AFTER_SECONDS: ${AGENT_ORCHESTRATION_STALE_AFTER_SECONDS:-120}
      DRIFT_WEBHOOK_ALLOWED_HOSTS:
      DRIFT_WEBHOOK_SIGNING_SECRET:
      OPENAI_API_KEY:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      FUXI_EMBEDDING_ENABLED: ${FUXI_EMBEDDING_ENABLED:-${EMBEDDING_ENABLED:-false}}
      FUXI_EMBEDDING_PROVIDER: ${FUXI_EMBEDDING_PROVIDER:-${EMBEDDING_PROVIDER:-openai-compatible}}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      RUST_LOG: ${RUST_LOG:-info}
      # Null entries inherit --env-file/shell values; when absent they stay unset.
      # Do not replace these with empty defaults: budgets fail closed on empty input.
      OPENAI_MAX_COMPLETION_TOKENS:
      OPENAI_MAX_ESTIMATED_CALL_COST_USD:
      OPENAI_MAX_PROJECT_DAILY_TOKENS:
      OPENAI_MAX_PROJECT_DAILY_ESTIMATED_COST_USD:
      OPENAI_MAX_ORCHESTRATION_ESTIMATED_COST_USD:
      OPENAI_MAX_ORCHESTRATION_OBSERVED_TOKENS:
      OPENAI_MODEL_MAX_CONCURRENCY:
      OPENAI_MODEL_SELECTION_POLICY:
      OPENAI_MODEL_CANDIDATES_JSON:
      OPENAI_REQUEST_OPTIONS_JSON:
      OPENAI_FALLBACK_MODELS:
      OPENAI_OPTIMIZATION_MODEL:
      OPENAI_ANALYSIS_MODEL:
      OPENAI_ANALYSIS_MODEL_SELECTION_POLICY:
      OPENAI_ANALYSIS_REQUEST_OPTIONS_JSON:
      OPENAI_ANALYSIS_FALLBACK_MODELS:
      OPENAI_ANALYSIS_EXPERIMENT_NAME:
      OPENAI_ANALYSIS_EXPERIMENT_MODEL:
      OPENAI_ANALYSIS_EXPERIMENT_TREATMENT_PERCENT:
      OPENAI_PLAN_MODEL:
      OPENAI_PLAN_MODEL_SELECTION_POLICY:
      OPENAI_PLAN_REQUEST_OPTIONS_JSON:
      OPENAI_PLAN_FALLBACK_MODELS:
      OPENAI_PLAN_EXPERIMENT_NAME:
      OPENAI_PLAN_EXPERIMENT_MODEL:
      OPENAI_PLAN_EXPERIMENT_TREATMENT_PERCENT:
      OPENAI_DSL_MODEL:
      OPENAI_DSL_MODEL_SELECTION_POLICY:
      OPENAI_DSL_REQUEST_OPTIONS_JSON:
      OPENAI_DSL_FALLBACK_MODELS:
      OPENAI_DSL_EXPERIMENT_NAME:
      OPENAI_DSL_EXPERIMENT_MODEL:
      OPENAI_DSL_EXPERIMENT_TREATMENT_PERCENT:
      OPENAI_CHANGE_INTENT_MODEL:
      OPENAI_CHANGE_INTENT_MODEL_SELECTION_POLICY:
      OPENAI_CHANGE_INTENT_REQUEST_OPTIONS_JSON:
      OPENAI_CHANGE_INTENT_FALLBACK_MODELS:
      OPENAI_CHANGE_INTENT_EXPERIMENT_NAME:
      OPENAI_CHANGE_INTENT_EXPERIMENT_MODEL:
      OPENAI_CHANGE_INTENT_EXPERIMENT_TREATMENT_PERCENT:
      OPENAI_ANALYSIS_SIMPLE_MODEL:
      OPENAI_ANALYSIS_COMPLEX_MODEL:
      OPENAI_ANALYSIS_EXPERIMENT_SIMPLE_MODEL:
      OPENAI_ANALYSIS_EXPERIMENT_COMPLEX_MODEL:
    ports:
      # Only a trusted local TLS reverse proxy may reach the app directly.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: fuxi-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_fresh_pg16_20261118:
    driver: local
  nginx_logs:
    driver: local
