[package]
name = "fuxi-dmn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-based DMN decision automation platform with a FEEL engine and LLM-assisted modeling."
license = "MIT"
readme = "README.md"
keywords = ["dmn", "feel", "decision-automation", "rust"]
categories = ["web-programming", "parsing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 1. 共享依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# 时间类型：前后端共用（DateTime<Utc>，serde 用于 JSON 序列化）
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1.13.0"

# 2. 前端依赖 - 可选，只在编译 WASM（启用 csr feature）时引入
#    注意：必须写在普通 [dependencies] 段内，若写在 target 段会被目标过滤掉
leptos = { version = "0.8.20", features = ["csr", "nightly"], optional = true }
# rsproxy 镜像中 leptos_router 0.8.x 最新为 0.8.15（无 0.8.20），与 leptos 0.8.20 兼容
leptos_router = { version = "0.8.15", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# 浏览器 API：reqwest 在 wasm 上要求绝对 URL，需用 window.location.origin 动态拼接
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard", "AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "Response", "ReadableStream", "ReadableStreamDefaultReader", "TextDecoder", "TextDecodeOptions", "Event"], optional = true }
# 前端可选：localStorage 存储 token（由 csr feature 启用）
gloo-storage = { version = "0.3", optional = true }

# 3. 后端依赖 - 仅在非 wasm 目标下编译（HTTP 栈无法运行在浏览器中）
[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
rust-embed = "8.7"
tokio-stream = { version = "0.1", features = ["sync"] } # SSE 流式转发
# gzip/brotli：用于兼容网关返回的压缩响应；响应体由 agent 统一读取和解压
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }
# Used only for gateways that return compressed bytes while advertising
# `Content-Encoding` incorrectly; reqwest's automatic decoder cannot recover
# those responses.
flate2 = "1.1"
brotli = "8"
# PostgreSQL 操作：runtime-tokio 用于 axum 异步环境；chrono 使 TIMESTAMPTZ 列映射到 DateTime<Utc>
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "derive", "chrono", "json"] }
# 读取 .env 中的 DATABASE_URL
dotenvy = "0.15"
# 认证与加密
jsonwebtoken = "9"
argon2 = "0.5"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4"] }
petgraph = "0.6"

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[features]
default = []
# CSR 编译特性
csr = [
  "dep:leptos",
  "dep:leptos_router",
  "dep:wasm-bindgen",
  "dep:console_error_panic_hook",
  "dep:web-sys",
  "dep:gloo-storage"
]

[[bin]]
name = "fuxi-dmn"
path = "src/main.rs"

[package.metadata.leptos]
# 实际输出的 JS/WASM 文件名前缀
name = "fuxi-dmn"
# site 根目录
site-root = "target/site"
site-pkg-dir = "pkg"
# 静态资源目录
assets-dir = "public"
# CSS 文件
style-file = "public/style/main.css"

# 前端 (Lib) 编译配置：开启 csr feature
lib-features = ["csr"]
lib-default-features = false

# 后端 编译配置：不开启 csr feature
bin-features = []
bin-default-features = false

# ==================== Release 优化配置 ====================
[profile.release]
# 最高优化级别
opt-level = 3
# 启用链接时优化 (LTO) - 减小二进制大小 20-30%
lto = "thin"
# 减少代码生成单元，提升优化效果
codegen-units = 1
# panic 时直接 abort，减小二进制 5-10%
panic = "abort"
# 去除调试符号，减小二进制 10-20%
strip = true

# WASM 专用：优化大小而非速度
[profile.release.package."*"]
opt-level = "z"
