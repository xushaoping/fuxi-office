services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: fuxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuxi_dmn
      POSTGRES_USER: fuxi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /opt/fuxi-dmn/releases/0.1.0/script/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    # 注释掉端口映射，避免与主机 PostgreSQL 冲突
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuxi -d fuxi_dmn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fuxi-DMN 应用（使用预构建镜像，无需构建）
  app:
    image: fuxi-dmn:0.1.0  # 使用本地构建好的镜像
    container_name: fuxi-dmn
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 数据库连接
      DATABASE_URL: postgres://fuxi:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/fuxi_dmn

      # 服务监听地址
      BIND_ADDR: 0.0.0.0:3000

      # 应用位于 Nginx 后面时使用真实客户端 IP 做验证码绑定和限流
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      CAPTCHA_POW_DIFFICULTY: ${CAPTCHA_POW_DIFFICULTY:-14}

      # JWT 密钥（生产环境必须修改！）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}

      # 超级管理员 admin 的初始密码（生产环境必须修改！）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}

      # OpenAI 配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo}

      # 日志级别
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # 仅允许宿主机上的 Nginx 访问；避免公网直接伪造 X-Forwarded-For
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理（可选但推荐）
  nginx:
    image: nginx:alpine
    container_name: fuxi-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
    driver: local
  nginx_logs:
    driver: local
