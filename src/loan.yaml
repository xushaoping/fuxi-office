    height: 80.0
  edges:
  - source: PolicyStatus
    target: ClaimEligibility
    waypoints: []
  - source: AccidentType
    target: ClaimEligibility
    waypoints: []
  - source: LossAmount
    target: ClaimEligibility
    waypoints: []
