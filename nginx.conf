user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker Compose 内置 DNS；应用容器重建后 IP 可能变化，不能只在 Nginx
    # 启动时解析一次 app，否则会继续访问旧容器地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream spreadsheet {
        server host.docker.internal:8090;
    }

    server {
        listen 80;
        server_name fuxioffice.cn;
        return 308 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name fuxioffice.cn;
        client_max_body_size 10M;

        ssl_certificate /etc/nginx/ssl/fuxioffice.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/fuxioffice.cn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $app_backend http://app:3000;
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Public TLS boundary replaces client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    server {
        listen 80;
        server_name spreadsheet.fuxioffice.cn;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name spreadsheet.fuxioffice.cn;
        client_max_body_size 10M;

        ssl_certificate /etc/nginx/ssl/spreadsheet.fuxioffice.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/spreadsheet.fuxioffice.cn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://spreadsheet;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Public TLS boundary replaces client-supplied forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
